<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscador Panther</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f4}
.header{background:#2e7d32;color:#fff;padding:20px;text-align:center}
.container{max-width:700px;margin:auto;padding:15px}
.search{width:100%;padding:14px;border-radius:12px;border:none;margin-top:10px}
.card{background:#fff;margin-top:12px;padding:14px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative}
.nombre{font-weight:700}
.precio{margin-top:6px;color:#2e7d32;font-weight:800;font-size:18px}
.copy-btn{
position:absolute;top:10px;right:10px;
background:#2e7d32;color:#fff;border:none;
padding:6px 10px;border-radius:8px;
font-weight:700;cursor:pointer
}
</style>

</head>

<body>

<div class="header">
  <h2>Buscador Panther</h2>
</div>

<div class="container">
  <input class="search" id="search" placeholder="Buscar producto...">
  <div id="results">Cargando productos...</div>
</div>

<script>

// 🔴 PEGÁ TU /exec AQUÍ

console.log("SCRIPT INICIADO");
const API = "https://script.google.com/macros/s/AKfycbwJIlZqeDGl9NVK3F3zRwMsjhUxjP_eDzTEo4MtK8-T8P8knCMEU85UORjkx8mphSbf/exec";
let DATA = [];

console.log("ANTES DE FETCH");

fetch(API)
  .then(r => {
    console.log("RESPUESTA STATUS:", r.status);
    return r.json();
  })
  .then(d => {
    console.log("DATA RECIBIDA:", d);

    DATA = d;

    document.getElementById("results").innerHTML =
      "DATA CARGADA: " + DATA.length + " registros";

    render("");
  })
  .catch(err => {
    console.error("ERROR FETCH:", err);
    document.getElementById("results").innerHTML =
      "ERROR CARGANDO API";
  });

console.log("FETCH INICIADO");

document.getElementById("search").addEventListener("input", function () {
  console.log("BUSQUEDA:", this.value);
  render(this.value.toLowerCase());
});

function render(q){
  const res = document.getElementById("results");
  res.innerHTML = "";

  if (!DATA || DATA.length === 0) {
    res.innerHTML = "SIN DATOS";
    return;
  }

  let count = 0;

  for (let i = 0; i < DATA.length; i++) {
    const p = DATA[i];

    if (!p.nombre) continue;

    if (p.nombre.toLowerCase().includes(q)) {

      res.innerHTML += `
        <div class="card">
          <div class="nombre">${p.nombre}</div>
          <div class="precio">${p.lista}</div>
        </div>
      `;

      count++;
      if (count >= 30) break;
    }
  }

  if (count === 0) {
    res.innerHTML = "SIN RESULTADOS";
  }
}

</script>

</body>
</html>
