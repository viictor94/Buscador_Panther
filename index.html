<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buscador Panther</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:#f4f6f4;
    color:#1a1a1a;
    min-height:100vh;
  }

  /* HEADER */
  .header{
    background:linear-gradient(160deg,#2e7d32,#1b5e20);
    padding:20px 16px 18px;
    text-align:center;
    color:white;
  }
  .logo{
    width:80px;
    height:80px;
    object-fit:contain;
    border-radius:50%;
    margin-bottom:8px;
    background:white;
    padding:4px;
  }
  .header h2{
    font-size:18px;
    font-weight:800;
    letter-spacing:.5px;
  }

  /* SEARCH */
  .search-wrap{
    padding:14px;
    background:#1b5e20;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:#fff;
    border-radius:50px;
    padding:10px 16px;
    gap:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.15);
  }
  .search-box svg{flex-shrink:0;color:#777}
  .search-box input{
    border:none;
    outline:none;
    flex:1;
    font-size:15px;
    font-family:inherit;
    background:transparent;
    color:#1a1a1a;
  }
  .search-box input::placeholder{color:#aaa}
  .clear-btn{
    background:none;border:none;cursor:pointer;
    color:#aaa;font-size:18px;line-height:1;padding:0 2px;
    display:none;
  }
  .clear-btn.visible{display:block}

  /* STATUS */
  .status-bar{
    padding:7px 14px;
    background:#2e7d32;
    color:#c8e6c9;
    font-size:12px;
    font-weight:600;
  }

  /* CONTAINER */
  .container{
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  /* WELCOME */
  .welcome{
    text-align:center;
    padding:48px 20px;
    color:#555;
  }
  .welcome .icon{font-size:44px;margin-bottom:12px}
  .welcome h3{font-size:20px;font-weight:800;color:#2e7d32;margin-bottom:6px}
  .welcome p{font-size:14px;color:#777}

  /* CARD */
  .card{
    background:white;
    border-radius:18px;
    padding:14px;
    box-shadow:0 3px 16px rgba(0,0,0,.08);
    border:1px solid #e8ede8;
  }

  .card-tag{
    font-size:11px;
    color:white;
    background:#2e7d32;
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:8px;
    font-weight:700;
  }

  .card-nombre{
    font-weight:800;
    font-size:14px;
    text-align:center;
    margin-bottom:12px;
    line-height:1.3;
  }

  /* PRECIO */
  .precio-hero{
    text-align:center;
    margin-bottom:12px;
    background:#f1f8f1;
    border-radius:12px;
    padding:10px;
  }
  .monto{
    font-size:26px;
    font-weight:900;
    color:#2e7d32;
  }
  .cuotas-badge{
    font-size:11px;
    color:#4caf50;
    font-weight:700;
    display:block;
    margin-top:2px;
  }

  /* PILLS */
  .pills{
    display:flex;
    gap:7px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .pill{
    font-size:12px;
    font-weight:700;
    padding:6px 11px;
    border-radius:10px;
  }
  .pill-efect{background:#e8f5e9;color:#2e7d32}
  .pill-cuotas{background:#e3f2fd;color:#1565c0}
  .pill-promo{background:#fff3e0;color:#e65100}

  .empty{
    text-align:center;
    padding:40px 20px;
    color:#999;
    font-size:14px;
  }
  .empty .icon{font-size:36px;display:block;margin-bottom:8px}
</style>
</head>
<body>

<div class="header">
  <img class="logo" src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png" onerror="this.style.display='none'">
  <h2>Buscador Panther</h2>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" fill="none" stroke="#999" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" placeholder="Buscar producto..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">×</button>
  </div>
</div>

<div class="status-bar" id="status">⏳ Cargando productos...</div>

<div class="container" id="results">
  <div class="welcome">
    <div class="icon">🛍️</div>
    <h3>Bienvenido</h3>
    <p>Buscá productos y precios en segundos</p>
    <p style="margin-top:6px;font-size:13px">🔍 Escribí para comenzar</p>
  </div>
</div>

<script>
let DATA = [];
const API_URL = "https://script.google.com/macros/s/AKfycbwT3k-j686myvD9lIZh1AC0JlgCYoFdLkIUSufvssgceVVyeZufJXqiQFzf-KCPCZz5/exec";

window.onload = () => { loadData(); };

function loadData(){
  fetch(API_URL)
    .then(r => r.json())
    .then(data => {
      DATA = data;
      document.getElementById("status").innerHTML = "✔ Lista cargada — " + DATA.length + " productos";
    })
    .catch(() => {
      document.getElementById("status").innerHTML = "⚠️ Error cargando datos";
    });
}

function clearSearch(){
  const inp = document.getElementById("search");
  inp.value = "";
  document.getElementById("clearBtn").classList.remove("visible");
  document.getElementById("results").innerHTML = `
    <div class="welcome">
      <div class="icon">🛍️</div>
      <h3>Bienvenido</h3>
      <p>Buscá productos y precios en segundos</p>
      <p style="margin-top:6px;font-size:13px">🔍 Escribí para comenzar</p>
    </div>`;
  inp.focus();
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  document.getElementById("clearBtn").classList.toggle("visible", q.length > 0);

  if(!q){
    clearSearch();
    return;
  }
  const res = DATA.filter(p =>
    (p.CODIGO && p.CODIGO.toLowerCase().includes(q)) ||
    (p.DETALLE && p.DETALLE.toLowerCase().includes(q))
  );
  render(res);
});

function fmt(v){ return v || ""; }

function render(data){
  if(!data.length){
    document.getElementById("results").innerHTML =
      `<div class="empty"><span class="icon">🔍</span>Sin resultados para esa búsqueda</div>`;
    return;
  }

  let html = "";
  data.forEach(p => {
    html += `
    <div class="card">
      ${p.CODIGO ? `<div class="card-tag">Cód: ${p.CODIGO}</div>` : ""}
      <div class="card-nombre">${fmt(p.DETALLE)}</div>
      <div class="precio-hero">
        <div class="monto">${fmt(p["PRECIO TARJETA 3 CUOTAS"])}</div>
        <span class="cuotas-badge">3 cuotas sin interés</span>
      </div>
      <div class="pills">
        ${p["PRECIO EFECTIVO / TRANSFER"] ? `<div class="pill pill-efect">💵 Efectivo: ${p["PRECIO EFECTIVO / TRANSFER"]}</div>` : ""}
        ${p["PRECIO TARJETA 6 CUOTAS"] ? `<div class="pill pill-cuotas">💳 6 cuotas: ${p["PRECIO TARJETA 6 CUOTAS"]}</div>` : ""}
        ${p["Promo 9 o 12 cuotas"] ? `<div class="pill pill-promo">🔥 Promo: ${p["Promo 9 o 12 cuotas"]}</div>` : ""}
      </div>
    </div>`;
  });
  document.getElementById("results").innerHTML = html;
}
</script>
</body>
</html>
