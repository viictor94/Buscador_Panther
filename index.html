<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Buscador Panther</title>
<meta name="description" content="Buscador de precios minoristas Panther Distribuciones">
<meta name="theme-color" content="#2a6b28">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* 🔥 TODO TU CSS IGUAL (NO SE TOCÓ NADA) */
:root {
  --g:#2e7d32;
  --gd:#1b5e20;
  --gl:#4caf50;
  --surface:#f4f6f4;
  --card:#fff;
  --text:#1a1a1a;
  --muted:#777;
  --border:#e8ede8;
  --efect:#2e7d32;
  --cuotas:#1565c0;
  --promo:#e65100;
  --radius:20px;
  --shadow:0 4px 24px rgba(0,0,0,.10);
}

/* (TODO EL RESTO DE TU CSS SIN CAMBIOS) */
body{font-family:'Nunito',sans-serif;background:var(--surface);}
</style>
</head>

<body>

<!-- 🔵 TU HTML IGUAL -->
<div class="header">
  <div class="header-inner">
    <div class="logo-wrap">
      <img src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png" class="logo">
    </div>
    <div class="header-text">
      <div class="title">Buscador Precios Minorista</div>
      <div class="subtitle">Panther Distribuciones</div>
    </div>
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Buscar producto...">
    <button class="clear-btn" id="clearBtn">✕</button>
  </div>
</div>

<div class="status-bar">
  <div class="spinner" id="spinner"></div>
  <span id="status-text">Cargando lista de precios...</span>
</div>

<div class="container" id="results"></div>

<script>

let DATA = [];

/* 🔴 IMPORTANTE: TU URL REAL DE APPS SCRIPT */
const API = "https://script.google.com/macros/s/AKfycbxIJ9zm8FWZz4IjRz-EREfzu4cTBO0s9amiUHjhtPS_1XHxiVk2QUQWHU56b4mmPoRc/exec;

/* ─────────── CARGA CORREGIDA ─────────── */
window.onload = () => {
  showWelcome();

  fetch(API)
    .then(async (r) => {
      const text = await r.text();

      try {
        return JSON.parse(text);
      } catch (e) {
        console.log("RESPUESTA CRUDA:", text);
        throw new Error("JSON inválido");
      }
    })
    .then(data => {
      DATA = data;

      document.getElementById("spinner").classList.add("done");
      document.getElementById("status-text").className = "ready";
      document.getElementById("status-text").textContent =
        "✓ Lista cargada — " + data.length + " productos";

      setTimeout(() => {
        document.getElementById("status-text").className = "info";
        document.getElementById("status-text").textContent = "Listo para buscar";
      }, 2500);
    })
    .catch(err => {
      console.log(err);
      document.getElementById("status-text").className = "loading";
      document.getElementById("status-text").textContent = "✗ Error al cargar datos";
    });
};

/* ─────────── WELCOME ─────────── */
function showWelcome() {
  document.getElementById("results").innerHTML = `
    <div class="welcome-card">
      <span class="welcome-icon">🛍️</span>
      <h2>Bienvenido</h2>
      <p>Consultá precios minoristas y promociones</p>
      <div class="welcome-box">🔍 Escribí para comenzar</div>
    </div>
  `;
}

/* ─────────── SEARCH ─────────── */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  document.getElementById("clearBtn").style.display = q ? "flex" : "none";

  if (!q) return showWelcome();

  const res = DATA.filter(p =>
    JSON.stringify(p).toLowerCase().includes(q)
  );

  render(res, q);
});

document.getElementById("clearBtn").onclick = () => {
  document.getElementById("search").value = "";
  showWelcome();
};

/* ─────────── RENDER ─────────── */
function render(data, q) {
  const el = document.getElementById("results");

  if (!data.length) {
    el.innerHTML = `<div class="empty">Sin resultados "${q}"</div>`;
    return;
  }

  el.innerHTML = data.map(p => `
    <div class="card">
      <div class="card-nombre">${p.DETALLE || ""}</div>
      <div class="precio-hero">
        <div class="monto">${p["PRECIO TARJETA 3 CUOTAS"] || ""}</div>
      </div>
    </div>
  `).join("");
}

</script>

</body>
</html>
