<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscador Panther</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">

<style>
body{margin:0;font-family:Arial;background:#f4f6f4}
.header{background:#2e7d32;color:#fff;padding:20px;text-align:center}
.logo{width:90px;border-radius:12px}
.container{max-width:700px;margin:auto;padding:15px}
.search{width:100%;padding:14px;border-radius:12px;border:none;margin-top:10px}
.card{background:#fff;margin-top:12px;padding:14px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative}
.nombre{font-weight:700}
.precio{margin-top:6px;color:#2e7d32;font-weight:800;font-size:18px}
.copy-btn{
position:absolute;top:10px;right:10px;
background:#2e7d32;color:#fff;border:none;
padding:6px 10px;border-radius:8px;
font-weight:700;cursor:pointer
}
</style>
</head>

<body>

<div class="header">
  <img class="logo" src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png">
  <h2>Buscador Panther</h2>
</div>

<div class="container">
  <input class="search" id="search" placeholder="Buscar producto...">
  <div id="results"></div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyMpvZLy6cUQy_hl6u9KhPIEG6_B_0KqYRdl33_CoMG1I1DI3rHWsBfll0uplrw6XE/exec?api=1";

let DATA = [];

fetch(API)
.then(r => r.json())
.then(d => DATA = d);

document.getElementById("search").addEventListener("input", function(){

const q = this.value.toLowerCase();
const res = document.getElementById("results");
res.innerHTML = "";

DATA.forEach(p => {

if(!p.nombre.toLowerCase().includes(q)) return;

res.innerHTML += `
<div class="card">
  <div class="nombre">${p.nombre}</div>
  <div class="precio">${p.lista}</div>

  <button class="copy-btn" onclick="copiar('${p.nombre} - ${p.lista}')">
    Copiar
  </button>
</div>
`;

});

});

function copiar(text){
navigator.clipboard.writeText(text);
}

</script>

</body>
</html>
