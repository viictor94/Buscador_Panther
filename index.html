<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Buscador Panther</title>
<meta name="description" content="Buscador de precios minoristas Panther Distribuciones">

<!-- PWA -->
<meta name="theme-color" content="#2e7d32">
<meta name="application-name" content="Buscador">
<meta name="apple-mobile-web-app-title" content="Buscador">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Ícono para iOS -->
<link rel="apple-touch-icon" href="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png">
<link rel="icon" type="image/png" href="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png">

<!-- Manifest real (clave para Android) -->
<link rel="manifest" href="manifest.json">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2e7d32;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
  }
  img { width: 120px; border-radius: 20px; margin-bottom: 20px; }
  p { color: rgba(255,255,255,.8); font-size: 14px; }
  .dot { display: inline-block; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%,80%,100% { opacity: 0; }
    40% { opacity: 1; }
  }
</style>
</head>
<body>
  <img src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png" alt="Panther">
  <p>Cargando<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>

  <script>
    // ⬇️ REEMPLAZÁ ESTA URL POR LA URL DE TU APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMpvZLy6cUQy_hl6u9KhPIEG6_B_0KqYRdl33_CoMG1I1DI3rHWsBfll0uplrw6XE/exec";

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    // Redirigir al Apps Script
    window.location.replace(APPS_SCRIPT_URL);
  </script>
</body>
</html>
