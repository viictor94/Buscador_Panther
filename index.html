<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buscador Panther</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#eef2ee;
  color:#1a1a1a;
  min-height:100vh;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#3a8c3f 0%,#2e7d32 50%,#1b5e20 100%);
  padding:22px 20px 26px;
  display:flex;
  align-items:center;
  gap:18px;
}
.logo-wrap{
  flex-shrink:0;
  width:90px;height:90px;
  background:white;
  border-radius:16px;
  padding:5px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  overflow:hidden;
}
.logo-wrap img{width:100%;height:100%;object-fit:contain}
.header-text{color:white}
.header-text h1{
  font-size:clamp(16px,4vw,22px);
  font-weight:900;
  letter-spacing:.3px;
  line-height:1.2;
}
.header-text p{
  font-size:clamp(12px,3vw,15px);
  opacity:.85;
  margin-top:3px;
  font-weight:600;
}

/* SEARCH */
.search-wrap{
  background:linear-gradient(180deg,#1b5e20,#2e7d32);
  padding:14px 16px 18px;
}
.search-box{
  display:flex;
  align-items:center;
  background:#fff;
  border-radius:50px;
  padding:11px 16px;
  gap:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
}
.search-box svg{flex-shrink:0}
.search-box input{
  border:none;outline:none;flex:1;
  font-size:16px;
  font-family:inherit;
  background:transparent;
  color:#1a1a1a;
  min-width:0;
}
.search-box input::placeholder{color:#bbb}
.clear-btn{
  background:none;border:none;cursor:pointer;
  color:#bbb;font-size:22px;line-height:1;
  padding:0;display:none;flex-shrink:0;
  transition:color .2s;
}
.clear-btn:hover{color:#888}
.clear-btn.visible{display:block}

/* STATUS */
.status-bar{
  background:#2e7d32;
  color:#c8e6c9;
  font-size:12px;
  font-weight:700;
  padding:6px 16px;
  display:flex;
  align-items:center;
  gap:6px;
}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:#69f0ae;flex-shrink:0;
}

/* CONTAINER */
.container{padding:16px;display:flex;flex-direction:column;gap:14px}

/* WELCOME */
.welcome{
  text-align:center;padding:50px 20px;color:#666;
}
.welcome .wi{font-size:48px;margin-bottom:14px}
.welcome h3{font-size:20px;font-weight:800;color:#2e7d32;margin-bottom:6px}
.welcome p{font-size:14px;color:#888;margin-top:4px}

/* CARD */
.card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.09);
  border:1px solid #e0e8e0;
  position:relative;
}

.card-tag{
  position:absolute;top:12px;right:12px;
  font-size:11px;font-weight:800;
  color:white;background:#2e7d32;
  padding:4px 12px;border-radius:20px;
  letter-spacing:.3px;
}

.card-body{padding:18px 16px 16px}

.card-nombre{
  font-weight:800;font-size:14px;
  text-align:center;
  margin:8px 0 16px;
  line-height:1.4;
  padding-right:80px; /* espacio para el tag */
  color:#111;
}

/* PRECIO PRINCIPAL */
.precio-hero{
  text-align:center;
  margin-bottom:14px;
}
.monto-principal{
  font-size:clamp(26px,7vw,34px);
  font-weight:900;
  color:#2e7d32;
  letter-spacing:.5px;
}
.badge-cuotas{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#e8f5e9;
  color:#2e7d32;
  border-radius:20px;
  padding:4px 12px;
  font-size:12px;
  font-weight:800;
  margin-top:6px;
}
.badge-cuotas::before{content:"✦";font-size:10px}
.por-cuota{
  font-size:13px;color:#666;font-weight:600;
  margin-top:5px;
}

/* PILLS GRID */
.pills-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:4px;
}
.pill-box{
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  border:1.5px solid;
}
.pill-label{
  font-size:10px;font-weight:700;
  margin-bottom:5px;display:flex;
  align-items:center;justify-content:center;gap:3px;
}
.pill-monto{
  font-size:clamp(13px,3.5vw,16px);
  font-weight:900;
  display:block;
}

/* Efectivo */
.pill-efect{
  background:#f1fbf2;border-color:#2e7d32;
}
.pill-efect .pill-label{color:#555}
.pill-efect .pill-monto{
  background:#2e7d32;color:white;
  border-radius:8px;padding:4px 6px;
  display:inline-block;
}

/* 6 cuotas */
.pill-cuotas{
  background:#f0f7ff;border-color:#1565c0;
}
.pill-cuotas .pill-label{color:#555}
.pill-cuotas .pill-monto{color:#1565c0}

/* 9-12 cuotas */
.pill-promo{
  background:#fff8f0;border-color:#e65100;
}
.pill-promo .pill-label{color:#555}
.pill-promo .pill-monto{color:#e65100}

/* Código inferior */
.card-footer{
  text-align:center;
  padding:8px 16px 12px;
  font-size:12px;color:#aaa;font-weight:600;
}

/* Sin resultados */
.empty{
  text-align:center;padding:40px 20px;
  color:#999;font-size:14px;
}
.empty span{font-size:36px;display:block;margin-bottom:10px}

/* Responsive para pantallas muy chicas */
@media(max-width:360px){
  .pills-grid{gap:5px}
  .pill-box{padding:8px 4px}
  .pill-monto{font-size:12px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-wrap">
    <img src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png" alt="Panther" onerror="this.parentElement.innerHTML='🐾'">
  </div>
  <div class="header-text">
    <h1>Buscador Precios Minorista</h1>
    <p>Panther Distribuciones</p>
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="20" height="20" fill="none" stroke="#aaa" stroke-width="2.2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search" placeholder="Buscar producto..." autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">×</button>
  </div>
</div>

<div class="status-bar" id="status">
  <div class="status-dot" id="dot" style="background:#ffca28"></div>
  <span id="statusText">Cargando...</span>
</div>

<div class="container" id="results">
  <div class="welcome">
    <div class="wi">🛍️</div>
    <h3>Bienvenido</h3>
    <p>Buscá productos y precios en segundos</p>
    <p>🔍 Escribí para comenzar</p>
  </div>
</div>

<script>
let DATA = [];
const API_URL = "https://script.google.com/macros/s/AKfycbwT3k-j686myvD9lIZh1AC0JlgCYoFdLkIUSufvssgceVVyeZufJXqiQFzf-KCPCZz5/exec";

window.onload = loadData;

function loadData(){
  fetch(API_URL)
    .then(r => r.json())
    .then(data => {
      DATA = data;
      document.getElementById("dot").style.background = "#69f0ae";
      document.getElementById("statusText").textContent = "✓ Lista cargada — " + DATA.length + " productos";
    })
    .catch(() => {
      document.getElementById("dot").style.background = "#ff5252";
      document.getElementById("statusText").textContent = "⚠ Error cargando datos";
    });
}

function clearSearch(){
  const inp = document.getElementById("search");
  inp.value = "";
  document.getElementById("clearBtn").classList.remove("visible");
  document.getElementById("results").innerHTML = `
    <div class="welcome">
      <div class="wi">🛍️</div>
      <h3>Bienvenido</h3>
      <p>Buscá productos y precios en segundos</p>
      <p>🔍 Escribí para comenzar</p>
    </div>`;
  inp.focus();
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();
  document.getElementById("clearBtn").classList.toggle("visible", q.length > 0);
  if(!q){ clearSearch(); return; }
  const res = DATA.filter(p =>
    (p.CODIGO && p.CODIGO.toLowerCase().includes(q)) ||
    (p.DETALLE && p.DETALLE.toLowerCase().includes(q))
  );
  render(res, q);
});

function calcCuota(precio, n){
  const v = parseFloat(String(precio).replace(/[^0-9.,]/g,"").replace(",","."));
  if(isNaN(v)) return "";
  return "de $" + Math.round(v/n).toLocaleString("es-AR") + " c/u";
}

function render(data, q){
  const cont = document.getElementById("results");

  // status
  document.getElementById("statusText").textContent =
    data.length === 0 ? "Sin resultados" :
    data.length === 1 ? "1 resultado" :
    data.length + " resultados";

  if(!data.length){
    cont.innerHTML = `<div class="empty"><span>🔍</span>Sin resultados para "<strong>${q}</strong>"</div>`;
    return;
  }

  let html = "";
  data.forEach(p => {
    const cuota3 = calcCuota(p["PRECIO TARJETA 3 CUOTAS"], 3);
    html += `
    <div class="card">
      ${p.CODIGO ? `<div class="card-tag">Cód: ${p.CODIGO}</div>` : ""}
      <div class="card-body">
        <div class="card-nombre">${p.DETALLE||""}</div>
        <div class="precio-hero">
          <div class="monto-principal">${p["PRECIO TARJETA 3 CUOTAS"]||""}</div>
          <div><span class="badge-cuotas">3 cuotas sin interés</span></div>
          ${cuota3 ? `<div class="por-cuota">${cuota3}</div>` : ""}
        </div>
        <div class="pills-grid">
          ${p["PRECIO EFECTIVO / TRANSFER"] ? `
          <div class="pill-box pill-efect">
            <div class="pill-label">🖥 Efectivo / Transf.🔥</div>
            <span class="pill-monto">${p["PRECIO EFECTIVO / TRANSFER"]}</span>
          </div>` : "<div></div>"}

          ${p["PRECIO TARJETA 6 CUOTAS"] ? `
          <div class="pill-box pill-cuotas">
            <div class="pill-label">💳 6 cuotas</div>
            <span class="pill-monto">${p["PRECIO TARJETA 6 CUOTAS"]}</span>
          </div>` : "<div></div>"}

          ${p["Promo 9 o 12 cuotas"] ? `
          <div class="pill-box pill-promo">
            <div class="pill-label">💳 9 o 12 cuotas</div>
            <span class="pill-monto">${p["Promo 9 o 12 cuotas"]}</span>
          </div>` : "<div></div>"}
        </div>
      </div>
      ${p.CODIGO ? `<div class="card-footer">Código: ${p.CODIGO}</div>` : ""}
    </div>`;
  });
  cont.innerHTML = html;
}
</script>
</body>
</html>
