<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buscador Panther</title>

<style>
body{font-family:Arial;background:#eef2ee;margin:0}
.header{background:#2e7d32;color:#fff;padding:18px;text-align:center;font-weight:800}
.search{padding:14px}
.search input{width:100%;padding:12px;border-radius:20px;border:1px solid #ccc;font-size:16px}
.container{padding:10px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;padding:14px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.title{font-weight:800;text-align:center;margin-bottom:10px}
.price{font-size:20px;font-weight:900;color:#2e7d32;text-align:center}
.row{display:flex;justify-content:space-between;margin-top:10px;font-size:13px}
.badge{background:#e8f5e9;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.empty{text-align:center;color:#777;margin-top:40px}
</style>
</head>

<body>

<div class="header">Buscador Panther</div>

<div class="search">
  <input id="search" placeholder="Buscar producto...">
</div>

<div class="container" id="results">
  <div class="empty">Escribí para buscar productos</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwT3k-j686myvD9lIZh1AC0JlgCYoFdLkIUSufvssgceVVyeZufJXqiQFzf-KCPCZz5/exec";

let timer = null;

// debounce para no saturar el server
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(timer);

  const q = e.target.value.trim();

  if (!q) {
    document.getElementById("results").innerHTML =
      `<div class="empty">Escribí para buscar productos</div>`;
    return;
  }

  timer = setTimeout(() => search(q), 300);
});

function search(q){
  fetch(API + "?q=" + encodeURIComponent(q))
    .then(r => r.json())
    .then(data => render(data, q))
    .catch(() => {
      document.getElementById("results").innerHTML =
        `<div class="empty">Error de conexión</div>`;
    });
}

function render(data, q){
  const cont = document.getElementById("results");

  if(!data.length){
    cont.innerHTML = `<div class="empty">Sin resultados para "<b>${q}</b>"</div>`;
    return;
  }

  cont.innerHTML = data.map(p => `
    <div class="card">
      <div class="title">${p.DETALLE || ""}</div>
      <div class="price">${p["PRECIO TARJETA 3 CUOTAS"] || ""}</div>

      <div class="row">
        <span class="badge">Efectivo</span>
        <span>${p["PRECIO EFECTIVO / TRANSFER"] || "-"}</span>
      </div>

      <div class="row">
        <span class="badge">6 cuotas</span>
        <span>${p["PRECIO TARJETA 6 CUOTAS"] || "-"}</span>
      </div>
    </div>
  `).join("");
}
</script>

</body>
</html>
