<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buscador Panther</title>

<meta name="theme-color" content="#2a6b28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Buscador%20Panther%22%2C%22short_name%22%3A%22Buscador%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%232a6b28%22%2C%22theme_color%22%3A%22%232a6b28%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fi.ibb.co%2F8nvntcR3%2FLogos-Clasico-Nueva-Fuente-2.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ===== TU CSS ORIGINAL (SIN CAMBIOS) ===== */
:root {
  --g:#2e7d32; --gd:#1b5e20; --gl:#4caf50;
  --surface:#f4f6f4; --card:#fff; --text:#1a1a1a;
  --muted:#777; --border:#e8ede8;
  --efect:#2e7d32; --cuotas:#1565c0; --promo:#e65100;
  --radius:20px; --shadow:0 4px 24px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--surface);color:var(--text);min-height:100vh}

.header{background:linear-gradient(160deg,var(--g),var(--gd));padding:20px 20px 0}
.header-inner{display:flex;align-items:center;gap:16px;max-width:700px;margin:0 auto}
.logo-wrap{background:rgba(255,255,255,.15);border-radius:16px;padding:8px}
.logo{width:120px}
.header .title{font-size:32px;font-weight:900;color:white;text-align:center}
.header .subtitle{font-size:18px;color:rgba(255,255,255,.75);text-align:center}

.search-wrap{background:linear-gradient(160deg,var(--g),var(--gd));padding:16px 20px 24px}
.search-box{display:flex;align-items:center;background:#fff;border-radius:50px;padding:10px 18px}
.search-box input{border:none;outline:none;flex:1;font-size:16px;font-family:inherit}
.clear-btn{display:none}
.clear-btn.visible{display:block}

.status-bar{background:var(--gd);color:#c8e6c9;padding:8px 16px;font-size:12px}
.spinner{width:12px;height:12px;border:2px solid #fff3;border-top-color:#ff6b6b;border-radius:50%}

.container{padding:16px;max-width:700px;margin:0 auto}

.card{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}
.card-nombre{text-align:center;font-weight:800;margin:10px 0}
.monto{text-align:center;font-size:32px;font-weight:900;color:#2e7d32}
.empty{text-align:center;color:#777;margin-top:40px}
</style>
</head>

<body>

<div class="header">
  <div class="header-inner">
    <div class="logo-wrap">
      <img src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png" class="logo">
    </div>
    <div>
      <div class="title">Buscador Precios Minorista</div>
      <div class="subtitle">Panther Distribuciones</div>
    </div>
  </div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <input id="search" placeholder="Buscar producto...">
    <button id="clearBtn" class="clear-btn">✕</button>
  </div>
</div>

<div class="status-bar">
  <div class="spinner" id="spinner"></div>
  <span id="status-text">Cargando...</span>
</div>

<div class="container" id="results">
  <div class="empty">Escribí para buscar productos</div>
</div>

<script>
let DATA = [];
const API = "https://script.google.com/macros/s/AKfycbwT3k-j686myvD9lIZh1AC0JlgCYoFdLkIUSufvssgceVVyeZufJXqiQFzf-KCPCZz5/exec";

/* ===== FETCH CORREGIDO ===== */
window.onload = () => {
fetch(API)
  .then(async (r) => {
    const text = await r.text();   // 👈 clave
    try {
      return JSON.parse(text);
    } catch (e) {
      console.log("RESPUESTA CRUDA:", text);
      throw new Error("JSON inválido desde API");
    }
  })
  .then(d => {
    DATA = d;
    setSpinner(true);
    setStatus("✓ Lista cargada — " + d.length + " productos", "ready");
  })
  .catch((err) => {
    console.log(err);
    setSpinner(true);
    setStatus("⚠ Error al cargar datos", "loading");
  });
};

/* ===== SEARCH ===== */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();

  if(!q){
    document.getElementById("results").innerHTML =
      `<div class="empty">Escribí para buscar productos</div>`;
    return;
  }

  const res = DATA.filter(p =>
    (p.CODIGO && p.CODIGO.toLowerCase().includes(q)) ||
    (p.DETALLE && p.DETALLE.toLowerCase().includes(q))
  );

  render(res, q);
});

/* ===== RENDER ===== */
function render(data, q){
  const cont = document.getElementById("results");

  if(!data.length){
    cont.innerHTML = `<div class="empty">Sin resultados para "${q}"</div>`;
    return;
  }

  cont.innerHTML = data.map(p => `
    <div class="card">
      <div class="card-nombre">${p.DETALLE || ""}</div>
      <div class="monto">${p["PRECIO TARJETA 3 CUOTAS"] || ""}</div>
    </div>
  `).join("");
}
</script>

</body>
</html>
