<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Buscador Panther</title>
<meta name="description" content="Buscador de precios minoristas Panther Distribuciones">
<meta name="theme-color" content="#2a6b28">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ===== TU CSS ORIGINAL (NO TOCADO) ===== */
:root {
  --g: #2e7d32;
  --gd: #1b5e20;
  --gl: #4caf50;
  --surface: #f4f6f4;
  --card: #ffffff;
  --text: #1a1a1a;
  --muted: #777;
  --border: #e8ede8;
  --efect: #2e7d32;
  --cuotas: #1565c0;
  --promo: #e65100;
  --radius: 20px;
  --shadow: 0 4px 24px rgba(0,0,0,.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--surface);
  color: var(--text);
  min-height: 100vh;
}

/* (TODO TU CSS ORIGINAL SIGUE IGUAL, NO LO TOCO POR BREVEDAD) */
/* 👉 lo dejé intacto en tu archivo original */
</style>
</head>

<body>

<!-- ===== HEADER (IGUAL) ===== -->
<div class="header">
  <div class="header-inner">
    <div class="logo-wrap">
      <img src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png" class="logo">
    </div>
    <div class="header-text">
      <div class="title">Buscador Precios Minorista</div>
      <div class="subtitle">Panther Distribuciones</div>
    </div>
  </div>
</div>

<!-- SEARCH (IGUAL) -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Buscar producto...">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
</div>

<!-- STATUS (IGUAL) -->
<div class="status-bar">
  <div class="spinner" id="spinner"></div>
  <span id="status-text">Cargando lista de precios...</span>
</div>

<!-- RESULTADOS -->
<div class="container" id="results"></div>

<script>

let DATA = [];

/* 🔥 TU URL DE APPS SCRIPT */
const API_URL = "https://script.google.com/macros/s/AKfycbwT3k-j686myvD9lIZh1AC0JlgCYoFdLkIUSufvssgceVVyeZufJXqiQFzf-KCPCZz5/exec";

/* ===== WELCOME ===== */
const welcomeHTML = `
<div class="welcome-card">
  <span class="welcome-icon">🛍️</span>
  <h2>Bienvenido</h2>
  <p>Aqui Encontras todos los Precios y promos para la Venta minorista.</p>
  <div class="welcome-box">🔍 Escribí en el Buscador para comenzar</div>
</div>`;

/* ===== INIT ===== */
window.onload = function () {
  document.getElementById("results").innerHTML = welcomeHTML;
  loadData();
};

/* ===== CARGAR JSON ===== */
function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      DATA = data;

      document.getElementById("spinner").classList.add("done");
      document.getElementById("status-text").className = "ready";
      document.getElementById("status-text").textContent =
        "✓ Lista cargada — " + DATA.length + " productos";
    })
    .catch(() => {
      document.getElementById("status-text").textContent = "Error al cargar datos";
    });
}

/* ===== BUSCADOR ===== */
document.getElementById("search").addEventListener("input", function () {
  const q = this.value.toLowerCase().trim();

  if (!q) {
    document.getElementById("results").innerHTML = welcomeHTML;
    return;
  }

  const filtered = DATA.filter(p =>
    (p.CODIGO && p.CODIGO.toLowerCase().includes(q)) ||
    (p.DETALLE && p.DETALLE.toLowerCase().includes(q))
  );

  render(filtered, q);
});

/* ===== RENDER ===== */
function render(data, q) {
  const el = document.getElementById("results");

  if (!data.length) {
    el.innerHTML = `
      <div class='empty'>
        🔎 Sin resultados para "<b>${q}</b>"
      </div>`;
    return;
  }

  let html = "";

  data.forEach((p, i) => {
    html += `
    <div class="card">

      ${p.CODIGO ? `<div class="card-tag">Cód: ${p.CODIGO}</div>` : ""}

      <div class="card-nombre">${p.DETALLE || ""}</div>

      <div class="precio-hero">
        <span class="monto">${p["PRECIO TARJETA 3 CUOTAS"] || ""}</span>
        <span class="cuotas-badge">✦ 3 cuotas sin interés</span>
      </div>

      <div class="pills">

        ${p["PRECIO EFECTIVO / TRANSFER"] ? `
        <div class="pill pill-efect">
          💵 ${p["PRECIO EFECTIVO / TRANSFER"]}
        </div>` : ""}

        ${p["PRECIO TARJETA 6 CUOTAS"] ? `
        <div class="pill pill-cuotas">
          💳 ${p["PRECIO TARJETA 6 CUOTAS"]}
        </div>` : ""}

        ${p["Promo 9 o 12 cuotas"] ? `
        <div class="pill pill-promo">
          🔥 ${p["Promo 9 o 12 cuotas"]}
        </div>` : ""}

      </div>

    </div>`;
  });

  el.innerHTML = html;
}

/* ===== LIMPIAR ===== */
function clearSearch() {
  document.getElementById("search").value = "";
  document.getElementById("results").innerHTML = welcomeHTML;
}

</script>

</body>
</html>
