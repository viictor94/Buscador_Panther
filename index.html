<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscador Panther</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f4}
.header{background:#2e7d32;color:#fff;padding:20px;text-align:center}
.container{max-width:700px;margin:auto;padding:15px}
.search{width:100%;padding:14px;border-radius:12px;border:none;margin-top:10px}
.card{background:#fff;margin-top:12px;padding:14px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative}
.nombre{font-weight:700}
.precio{margin-top:6px;color:#2e7d32;font-weight:800;font-size:18px}
.copy-btn{
position:absolute;top:10px;right:10px;
background:#2e7d32;color:#fff;border:none;
padding:6px 10px;border-radius:8px;
font-weight:700;cursor:pointer
}
</style>

</head>

<body>

<div class="header">
  <h2>Buscador Panther</h2>
</div>

<div class="container">
  <input class="search" id="search" placeholder="Buscar producto...">
  <div id="results">Cargando productos...</div>
</div>

// <script>

// 🔴 PEGÁ ACÁ TU /exec
const API = "https://script.google.com/macros/s/AKfycbwJIlZqeDGl9NVK3F3zRwMsjhUxjP_eDzTEo4MtK8-T8P8knCMEU85UORjkx8mphSbf/exec";

let DATA = [];

document.getElementById("results").innerHTML = "Cargando productos...";

// FETCH CON DEBUG REAL
fetch(API)
  .then(async (res) => {
    console.log("STATUS:", res.status);

    const text = await res.text();
    console.log("RESPUESTA CRUDA:", text);

    try {
      DATA = JSON.parse(text);
      console.log("DATA OK:", DATA);

      render("");
    } catch (e) {
      console.error("ERROR JSON:", e);
      document.getElementById("results").innerHTML =
        "Error: la API no devolvió JSON válido";
    }
  })
  .catch(err => {
    console.error("ERROR FETCH:", err);
    document.getElementById("results").innerHTML =
      "Error cargando datos (API falló)";
  });

// BUSCADOR
document.getElementById("search").addEventListener("input", function () {
  render(this.value.toLowerCase());
});

// RENDER
function render(q){
  const res = document.getElementById("results");
  res.innerHTML = "";

  if (!DATA || DATA.length === 0) {
    res.innerHTML = "No hay datos cargados";
    return;
  }

  const filtrados = DATA.filter(p =>
    (p.nombre || "").toLowerCase().includes(q)
  );

  if (filtrados.length === 0) {
    res.innerHTML = "No se encontraron resultados";
    return;
  }

  filtrados.forEach(p => {
    res.innerHTML += `
      <div class="card">
        <div class="nombre">${p.nombre || ""}</div>
        <div class="precio">${p.lista || ""}</div>

        <button class="copy-btn"
          data-text="${p.nombre} - ${p.lista}"
          onclick="navigator.clipboard.writeText(this.dataset.text)">
          Copiar
        </button>
      </div>
    `;
  });
}
</script>

</body>
</html>
