<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Buscador Panther</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --g:#2e7d32;
  --gd:#1b5e20;
  --gl:#4caf50;
  --surface:#f4f6f4;
  --card:#fff;
  --text:#1a1a1a;
  --muted:#777;
  --border:#e8ede8;
  --efect:#2e7d32;
  --cuotas:#1565c0;
  --promo:#e65100;
  --radius:20px;
  --shadow:0 4px 24px rgba(0,0,0,.10);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Nunito',sans-serif;
  background:var(--surface);
  color:var(--text);
}

/* HEADER */
.header{
  background:linear-gradient(160deg,var(--g),var(--gd));
  padding:20px;
  text-align:center;
  color:white;
}
.logo{width:90px}

/* SEARCH */
.search-wrap{padding:15px}
.search-box{
  display:flex;
  background:#fff;
  border-radius:50px;
  padding:10px 15px;
  box-shadow:var(--shadow);
}
.search-box input{
  border:none;
  outline:none;
  flex:1;
  font-size:16px;
}

/* STATUS */
.status-bar{
  padding:10px;
  background:var(--gd);
  color:white;
  font-size:12px;
}

/* CONTAINER */
.container{
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* CARD */
.card{
  background:white;
  border-radius:var(--radius);
  padding:15px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.card-tag{
  font-size:11px;
  color:white;
  background:var(--g);
  display:inline-block;
  padding:3px 10px;
  border-radius:10px;
  margin-bottom:8px;
}

.card-nombre{
  font-weight:800;
  text-align:center;
  margin-bottom:10px;
}

/* PRECIO */
.precio-hero{
  text-align:center;
  margin-bottom:10px;
}

.monto{
  font-size:28px;
  font-weight:900;
  color:var(--g);
}

.cuotas-badge{
  font-size:11px;
  color:var(--g);
  display:block;
}

/* PILLS */
.pills{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.pill{
  font-size:12px;
  padding:6px 10px;
  border-radius:12px;
  background:#f1f1f1;
}

/* COLORS */
.pill-efect{background:#e8f5e9;color:var(--efect)}
.pill-cuotas{background:#e3f2fd;color:var(--cuotas)}
.pill-promo{background:#fff3e0;color:var(--promo)}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="header">
  <img class="logo" src="https://i.ibb.co/8nvntcR3/Logos-Clasico-Nueva-Fuente-2.png">
  <h2>Buscador Panther</h2>
</div>

<div class="search-wrap">
  <div class="search-box">
    <input id="search" placeholder="Buscar producto...">
  </div>
</div>

<div class="status-bar" id="status">Cargando...</div>

<div class="container" id="results"></div>

<script>

let DATA = [];

const API_URL = "https://script.google.com/macros/s/AKfycbwT3k-j686myvD9lIZh1AC0JlgCYoFdLkIUSufvssgceVVyeZufJXqiQFzf-KCPCZz5/exec";

/* INIT */
window.onload = () => {
  loadData();
  document.getElementById("results").innerHTML = `<div class="empty">Buscá un producto</div>`;
};

/* LOAD */
function loadData(){
  fetch(API_URL)
    .then(r => r.json())
    .then(data => {
      DATA = data;
      document.getElementById("status").innerText = "✔ " + DATA.length + " productos cargados";
    })
    .catch(() => {
      document.getElementById("status").innerText = "Error cargando datos";
    });
}

/* SEARCH */
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase().trim();

  if(!q){
    document.getElementById("results").innerHTML = `<div class="empty">Buscá un producto</div>`;
    return;
  }

  const res = DATA.filter(p =>
    (p.CODIGO && p.CODIGO.toLowerCase().includes(q)) ||
    (p.DETALLE && p.DETALLE.toLowerCase().includes(q))
  );

  render(res);
});

/* RENDER */
function render(data){

  if(!data.length){
    document.getElementById("results").innerHTML =
      `<div class="empty">Sin resultados</div>`;
    return;
  }

  let html = "";

  data.forEach(p => {

    html += `
    <div class="card">

      ${p.CODIGO ? `<div class="card-tag">Cód: ${p.CODIGO}</div>` : ""}

      <div class="card-nombre">${p.DETALLE || ""}</div>

      <div class="precio-hero">
        <div class="monto">${p["PRECIO TARJETA 3 CUOTAS"] || ""}</div>
        <span class="cuotas-badge">3 cuotas sin interés</span>
      </div>

      <div class="pills">

        ${p["PRECIO EFECTIVO / TRANSFER"] ?
        `<div class="pill pill-efect">Efectivo: ${p["PRECIO EFECTIVO / TRANSFER"]}</div>` : ""}

        ${p["PRECIO TARJETA 6 CUOTAS"] ?
        `<div class="pill pill-cuotas">6 cuotas: ${p["PRECIO TARJETA 6 CUOTAS"]}</div>` : ""}

        ${p["Promo 9 o 12 cuotas"] ?
        `<div class="pill pill-promo">Promo: ${p["Promo 9 o 12 cuotas"]}</div>` : ""}

      </div>

    </div>`;
  });

  document.getElementById("results").innerHTML = html;
}

</script>

</body>
</html>
